name: Build

# Solo al publicar una release (tag v*) o a mano desde Actions → Build → Run workflow.
# No corre en cada push, así se puede trabajar en main sin gastar minutos de CI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # necesario solo para adjuntar binarios a releases de tags v*

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencias del sistema (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential \
            libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Inno Setup (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Frontend (tests y build)
        run: |
          npm ci
          npm test

      # build.sh corre cargo test y empaqueta (deb+AppImage en Linux, instalador Inno Setup en Windows)
      - name: Compilar y empaquetar
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: docflow-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error

      - name: Adjuntar a la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
